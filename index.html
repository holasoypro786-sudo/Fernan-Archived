<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FERNAN ARCHIVED</title>
<style>
body{background:#000;color:#555;font-family:monospace;text-align:center;padding:0;margin:0}
#entrada{
  position:fixed;inset:0;background:#000;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
#entrada button{
  background:#0a0a0a;border:1px solid #444;color:#888;padding:20px 50px;
  letter-spacing:6px;font-family:monospace;cursor:pointer;font-size:16px
}
#entrada button:active{background:#200;color:red}
h1{font-size:32px;letter-spacing:10px;color:#111;margin-top:30px}
#perro{width:300px;margin-top:20px;filter:contrast(130%) grayscale(30%);border:1px solid #151515}
.botones{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:340px;margin:25px auto}
.botones a{border:1px solid #1c1c1c;padding:14px;text-decoration:none;color:#3a3a3a;font-size:11px;background:#050505}
</style>
</head>
<body>

<div id="entrada">
  <p style="font-size:10px;color:#333;margin-bottom:20px;letter-spacing:3px">archivo dañado - se requiere audio</p>
  <button id="btnEntrar">▶ ENTRAR</button>
  <p style="font-size:8px;color:#222;margin-top:15px">[ usa audifonos ]</p>
  <p id="error" style="font-size:9px;color:#400;margin-top:10px"></p>
</div>

<h1>FERNAN<br>ARCHIVED</h1>
<p style="font-size:9px;letter-spacing:4px;color:#333">archivo perdido 2014-2017</p>

<img id="perro" src="Picsart_26-08-29_02-19-48-538.jpg">

<div class="botones">
  <a href="pasillo.html">□ PASILLO</a>
  <a href="????.html">□ ???</a>
  <a href="cuarto1.html">□ CUARTO 1</a>
  <a href="cuarto2.html">□ CUARTO 2</a>
</div>

<audio id="musica" loop preload="auto" src="https://cdn.pixabay.com/download/audio/2022/10/30/audio_8b64d9387a.mp3"></audio>

<script>
const musica = document.getElementById('musica');
const entrada = document.getElementById('entrada');
const btn = document.getElementById('btnEntrar');
const error = document.getElementById('error');

musica.volume = 0.5;

btn.addEventListener('click', () => {
  // 1. SIEMPRE te deja entrar, suene o no
  entrada.style.display = 'none';
  
  // 2. Intenta sonar
  musica.play().then(()=>{
    console.log("sonando");
  }).catch((e)=>{
    error.innerText = "si no suena, sube el volumen";
    // igual ya entró, no se queda pegado
  });
});
</script>

</body>
</html>
