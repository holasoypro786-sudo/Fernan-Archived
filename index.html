<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FERNAN ARCHIVED</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #000;
    color: #aaa;
    font-family: "Courier New", monospace;
    overflow-x: hidden;
}

/* ===== EFECTO DE PANTALLA ===== */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,0.025) 0px,
            rgba(255,255,255,0.025) 1px,
            transparent 1px,
            transparent 4px
        );
}

/* ===== INTRO ===== */

#intro {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    text-align: center;
}

#introText {
    color: #777;
    font-size: 13px;
    line-height: 2;
}

/* ===== PÁGINA ===== */

#site {
    display: none;
    min-height: 100vh;
}

.main {
    width: 94%;
    max-width: 900px;
    margin: auto;
    padding: 25px 10px 60px;
}

/* ===== TÍTULO ===== */

.logo {
    text-align: center;
    margin-top: 30px;
    margin-bottom: 45px;
}

.logo h1 {
    margin: 0;
    color: #ddd;
    font-size: clamp(28px, 8vw, 60px);
    letter-spacing: 8px;
    text-shadow: 0 0 12px #222;
}

.logo p {
    margin-top: 12px;
    color: #444;
    font-size: 11px;
}

/* ===== AVISO ===== */

.warning {
    border: 1px solid #252525;
    background: #050505;
    padding: 18px;
    margin-bottom: 25px;
    font-size: 12px;
    line-height: 1.7;
}

.warning b {
    color: #aaa;
}

/* ===== MENÚ ===== */

.menu {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.menu button {
    min-height: 65px;
    background: #070707;
    color: #777;
    border: 1px solid #252525;
    font-family: "Courier New", monospace;
    cursor: pointer;
    font-size: 12px;
    transition: 0.25s;
}

.menu button:hover {
    color: #ddd;
    background: #111;
    border-color: #555;
}

/* ===== SECCIONES ===== */

    padding: 20px;
    border: 1px solid #222;
    background: #030303;
}

.section.active {
    display: block;
}

    color: #bbb;
    font-size: 16px;
    letter-spacing: 2px;
