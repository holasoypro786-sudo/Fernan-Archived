<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FERNAN ARCHIVED</title>
<style>
body{background:#000;color:#555;font-family:monospace;text-align:center;padding:0;margin:0}
#entrada{
  position:fixed;inset:0;background:#000;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
#entrada button{
  background:#050505;border:1px solid #333;color:#666;padding:20px 40px;
  letter-spacing:5px;font-family:monospace;cursor:pointer;font-size:14px
}
#entrada button:hover{background:#100;color:#900;border-color:#600}
h1{font-size:32px;letter-spacing:10px;color:#111;margin-top:30px}
#perro{width:300px;margin-top:20px;filter:contrast(130%) grayscale(30%);border:1px solid #151515}
.botones{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:340px;margin:25px auto}
.botones a{border:1px solid #1c1c1c;padding:14px;text-decoration:none;color:#3a3a3a;font-size:11px;background:#050505}
</style>
</head>
<body>

<!-- PANTALLA DE ENTRADA - ESTO HACE QUE SUENE -->
<div id="entrada">
  <p style="font-size:10px;color:#222;margin-bottom:20px;letter-spacing:3px">archivo dañado - se requiere audio</p>
  <button onclick="entrar()">▶ ENTRAR</button>
  <p style="font-size:8px;color:#111;margin-top:15px">[ usa audifonos ]</p>
</div>

<h1>FERNAN<br>ARCHIVED</h1>
<p style="font-size:9px;letter-spacing:4px;color:#333">archivo perdido 2014-2017</p>

<img id="perro" src="Picsart_26-08-29_02-19-48-538.jpg">

<div class="botones">
  <a href="pasillo.html">□ PASILLO</a>
  <a href="????.html">□ ???</a>
  <a href="cuarto1.html">□ CUARTO 1</a>
  <a href="cuarto2.html">□ CUARTO 2</a>
</div>

<audio id="musica" loop preload="auto">
  <source src="terror.mp3" type="audio/mpeg">
  <source src="https://cdn.pixabay.com/download/audio/2022/10/30/audio_8b64d9387a.mp3" type="audio/mpeg">
</audio>

<script>
const musica = document.getElementById('musica');
const entrada = document.getElementById('entrada');
musica.volume = 0.6;

function entrar(){
  musica.play().then(()=>{
    entrada.style.display = 'none';
  }).catch(e=>{
    alert("Error: " + e + " - Revisa que subiste terror.mp3");
  });
}
</script>

</body>
</html>
